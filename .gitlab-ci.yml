image: node:20-alpine

.only_merge_requests_and_branches: &only_merge_requests_and_branches
  only:
    - merge_requests
    - "production"
    - "development"

stages:
  - build
  - test
  - deploy

variables:
  BUILD_PATH: ./dist
  NODE_CACHE_PATH: node_modules/
  PACKAGE_LOCK_HASH: "$(md5sum package-lock.json | cut -d ' ' -f1)"
  DEPLOY_PATH: $DEPLOY_PATH
  SERVER_USER: $DEPLOY_USER
  SERVER_IP: $DEPLOY_IP

cache:
  key: ${PACKAGE_LOCK_HASH}
  paths:
    - ${NODE_CACHE_PATH}
  policy: pull-push

build:
  stage: build
  before_script:
    - echo "VITE_SERVER_URI=$SERVER_URI" > .env.production
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - $BUILD_PATH
  allow_failure: false
  <<: *only_merge_requests_and_branches

eslint:
  stage: test
  script:
    - npm run lint:code
  allow_failure: false
  <<: *only_merge_requests_and_branches

stylelint:
  stage: test
  script:
    - npm run lint:style
  allow_failure: false
  <<: *only_merge_requests_and_branches

deploy:
  stage: deploy
  before_script:
    - apk add --no-cache rsync openssh
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ${SERVER_IP} >> ~/.ssh/known_hosts
  script:
    - rsync -avz -e "ssh" ${BUILD_PATH}/ ${SERVER_USER}@${SERVER_IP}:"${DEPLOY_PATH}"
  after_script:
    - rm -f ~/.ssh/id_rsa
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
