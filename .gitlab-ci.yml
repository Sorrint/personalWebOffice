image: node:20-alpine

stages:
  - buildProd
  - build
  - test

cache:
  key: '$CI_PIPELINE_ID'
  paths:
    - node_modules/
  policy: pull

build:
  cache:
    key: '$CI_PIPELINE_ID'
    paths:
      - node_modules/
    policy: push
  stage: build
  script:
    - npm install
  allow_failure: false
  only:
    - merge_requests

eslint:
  stage: test
  script:
    - npm run lint:code
  allow_failure: false
  only:
    - merge_requests

stylelint:
  stage: test
  script:
    - npm run lint:style
  allow_failure: false
  only:
    - merge_requests

buildProd:
  stage: buildProd
  before_script:
    - apk add --no-cache npm
  script:
    - npm install
    - npm run build
    - cd ./dist
    - git init
    - git add .
    - git commit -m "Auto commit by Gitlab CI"
    - git push origin HEAD:prod
  only:
    - development
